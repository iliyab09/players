name: ci

on:
  push:
    branches: [main]

permissions:
  contents: write   # commit the version bump
  id-token: write   # login to aws with oidc, no keys

jobs:
  # which services changed in this push
  changed:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            player1: services/player1/**
            player2: services/player2/**
            player3: services/player3/**
            player4: services/player4/**
            frontend: services/frontend/**

  # one job per changed service
  build:
    needs: changed
    if: needs.changed.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.changed.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: bump version (0.1.4 -> 0.1.5)
        id: v
        run: echo "tag=$(npm version patch --no-git-tag-version | tr -d v)" >> $GITHUB_OUTPUT

      - name: test
        run: npm ci && npm test

      - name: build
        run: docker build -t ${{ matrix.service }}:${{ steps.v.outputs.tag }} --build-arg APP_VERSION=${{ steps.v.outputs.tag }} .

      - name: scan (critical only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ steps.v.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: login to aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ecr
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: push
        run: |
          docker tag ${{ matrix.service }}:${{ steps.v.outputs.tag }} ${{ steps.ecr.outputs.registry }}/players/${{ matrix.service }}:${{ steps.v.outputs.tag }}
          docker push ${{ steps.ecr.outputs.registry }}/players/${{ matrix.service }}:${{ steps.v.outputs.tag }}

      - name: save version
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git commit -am "${{ matrix.service }} ${{ steps.v.outputs.tag }} [skip ci]"
          git pull --rebase && git push

      # tell argo: write the new tag into the devops repo
      - name: checkout devops
        if: env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.DEVOPS_REPO_TOKEN }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: update dev tag
        if: env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.DEVOPS_REPO_TOKEN }}
        working-directory: devops
        run: |
          yq -i '.image.tag = "${{ steps.v.outputs.tag }}"' charts/${{ matrix.service }}/values-dev.yaml
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git commit -am "dev: ${{ matrix.service }} ${{ steps.v.outputs.tag }}"
          git pull --rebase && git push
